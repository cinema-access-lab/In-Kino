name: Release

# Pushing a tag such as v0.8.0 builds a signed APK and publishes it as a GitHub release.
# The signing key comes from four repository secrets; see docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches VERSION
        run: |
          VERSION="$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check that the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "The repository secret ANDROID_$name is missing; see docs/releasing.md"
              exit 1
            fi
          done
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testReleaseUnitTest
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INKINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INKINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INKINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export INKINO_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$INKINO_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$INKINO_KEYSTORE"
      - name: Verify the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mkdir dist
          cp "$APK" "dist/in-kino-$VERSION.apk"
          (cd dist && sha256sum "in-kino-$VERSION.apk" > "in-kino-$VERSION.apk.sha256")
      - name: Write the release notes
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "## Changes"
            echo
            awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md
          } > dist/notes.md
          cat dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "In-Kino $VERSION" \
            --notes-file dist/notes.md \
            --prerelease \
            "dist/in-kino-$VERSION.apk" "dist/in-kino-$VERSION.apk.sha256"
