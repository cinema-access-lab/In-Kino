name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            desktop-publisher/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt -r desktop-publisher/requirements.txt \
            'pytest>=8,<10' 'httpx>=0.27,<1' 'ruff>=0.6'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Changelog has an entry for VERSION
        run: grep -qx "## $(cat VERSION)" CHANGELOG.md
      - name: Server and publisher tests
        run: python -m pytest -q

  java-format:
    runs-on: ubuntu-latest
    env:
      GJF_VERSION: '1.24.0'
      GJF_FLAGS: --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Java formatting (google-java-format, AOSP style)
        run: |
          curl -sSfL -o gjf.jar \
            "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar"
          git ls-files '*.java' | xargs java $GJF_FLAGS -jar gjf.jar --aosp --dry-run --set-exit-if-changed

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Assemble unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: in-kino-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
